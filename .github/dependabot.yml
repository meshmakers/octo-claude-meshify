# Dependabot standard configuration.
# One entry per ecosystem and manifest directory list, run monthly. All minor and patch updates
# of an ecosystem arrive in one pull request per manifest directory; the low
# open-pull-requests-limit keeps majors that are not ignored from piling up. The majors we hold
# on purpose are ignored (remove an ignore only together with the story that delivers that
# migration).
version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/skills/blueprint-packaging/examples"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # a new .NET major is a platform decision, not a Dependabot bump
      - dependency-name: "mcr.microsoft.com/dotnet/*"
        update-types: ["version-update:semver-major"]
      # same images, Dependabot may name them without the registry host
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
      # Node majors are planned
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # nginx majors are planned
      - dependency-name: "nginx"
        update-types: ["version-update:semver-major"]
      # internal images: legacy date-based tags sort above semver, our pipelines manage them
      - dependency-name: "meshmakers/*"
